# Builds the HyreMatch Tracker installers on GitHub's own Windows and Mac machines.
# Run it from the Actions tab ("Build installers" > Run workflow).
# Each build: runs the tests, builds the app, starts it once to make sure it opens, then puts the installers on a Release.
# Copy the installer links into Activity > Tracker app links.
name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npx electron-builder --win nsis --publish never
      - name: Start the built app once (it must stay open for 20 seconds)
        shell: bash
        run: |
          "dist/win-unpacked/HyreMatch Tracker.exe" &
          sleep 20
          tasklist | grep -i "HyreMatch Tracker" || { echo "The app closed by itself"; exit 1; }
          taskkill //F //IM "HyreMatch Tracker.exe" //T || true
      - name: Install it silently, check the files are there, and start the installed app
        shell: pwsh
        run: |
          $setup = (Get-Item dist\HyreMatch-Tracker-*-win.exe).FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          Start-Sleep -Seconds 5
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "HyreMatch Tracker.exe" | Select-Object -First 1
          if (-not $exe) { Write-Host "The app was not installed"; exit 1 }
          Write-Host "Installed at $($exe.FullName)"
          Start-Process -FilePath $exe.FullName
          Start-Sleep -Seconds 20
          if (-not (Get-Process -Name "HyreMatch Tracker" -ErrorAction SilentlyContinue)) { Write-Host "The installed app closed by itself"; exit 1 }
          Stop-Process -Name "HyreMatch Tracker" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe

  mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false # no Apple Developer ID yet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npx electron-builder --mac dir --universal --publish never
      - name: Sign it for this build (ad-hoc), so it can open on Apple Silicon Macs
        run: |
          codesign --force --deep --sign - "dist/mac-universal/HyreMatch Tracker.app"
          codesign --verify --deep --strict --verbose=2 "dist/mac-universal/HyreMatch Tracker.app"
      - name: Start the built app once (it must stay open for 20 seconds)
        run: |
          "dist/mac-universal/HyreMatch Tracker.app/Contents/MacOS/HyreMatch Tracker" &
          sleep 20
          pgrep -f "HyreMatch Tracker.app" || { echo "The app closed by itself"; exit 1; }
          pkill -f "HyreMatch Tracker.app" || true
      - run: npx electron-builder --mac dmg --universal --prepackaged "dist/mac-universal/HyreMatch Tracker.app" --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: dist/*.dmg

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish the installers on a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}-build${{ github.run_number }}
          name: HyreMatch Tracker ${{ steps.v.outputs.version }} (build ${{ github.run_number }})
          files: out/**/*

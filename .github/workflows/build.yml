# Builds the HyreMatch Tracker installers on GitHub's own Windows and Mac machines.
# Run it from the Actions tab ("Build installers" > Run workflow), or push a tag like v2.0.0.
# The installers are attached to a GitHub Release; copy their links into Activity > Tracker app links.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win nsis --publish never
            files: dist/*.exe
          - os: macos-latest
            cmd: npx electron-builder --mac dmg --universal --publish never
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # not signed yet (no Apple/Windows certificate)
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish the installers on a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: HyreMatch Tracker ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          files: out/**/*
